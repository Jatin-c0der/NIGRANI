<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NIGRANI — Safety map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,450;1,9..144,400&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<style>
  :root{
    --ink:#0D0F14; --ink-panel:#15181F; --paper:#F5F3EE; --paper-dim:#AFB3BE;
    --slate:#6E7A8A; --brass:#C9A15A; --line:rgba(245,243,238,.09); --line-strong:rgba(245,243,238,.18);
    --critical:#D97D6C; --high:#D8A65C; --medium:#C9BE7A;
    --serif:'Fraunces',Georgia,serif; --sans:'Work Sans',sans-serif;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:inherit;margin:0;padding:0}
  html,body{height:100%;background:var(--ink);color:var(--paper)}
  body{font-family:var(--sans);font-weight:300;overflow-x:hidden;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--brass);color:var(--ink)}

  nav.top{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:1.5rem clamp(24px,6vw,90px);mix-blend-mode:difference}
  nav.top .mark{font-family:var(--serif);font-size:1.05rem}
  nav.top .links{display:flex;gap:2.2rem;font-size:.85rem}
  nav.top .links a{opacity:.55;transition:opacity .25s ease;position:relative}
  nav.top .links a.active{opacity:1;color:var(--brass)}
  nav.top .links a.soon::after{content:"soon";position:absolute;top:-10px;right:-22px;font-size:.55rem;color:var(--brass);letter-spacing:.05em}
  @media(max-width:640px){nav.top .links{display:none}}

  main{padding:9rem clamp(24px,6vw,90px) 6rem}
  .label{color:var(--slate);font-size:.9rem;opacity:0}
  h1{font-family:var(--serif);font-weight:450;font-size:clamp(2.2rem,5vw,3.6rem);line-height:1.1;margin:1rem 0 3rem;opacity:0;transform:translateY(24px)}
  h1 em{font-style:italic;color:var(--brass)}

  .panel-grid{display:grid;grid-template-columns:2fr .8fr;gap:1.4rem;opacity:0;transform:translateY(30px)}
  @media(max-width:900px){.panel-grid{grid-template-columns:1fr}}

  .bigmap{height:560px;border:1px solid var(--line);border-radius:12px;position:relative;overflow:hidden;background:#12151B}
  .bigmap>span.tag{position:absolute;top:18px;left:18px;color:var(--paper-dim);font-size:.78rem;z-index:500;background:rgba(13,15,20,.7);backdrop-filter:blur(6px);padding:.4rem .8rem;border-radius:999px;border:1px solid var(--line-strong)}
  #dynamicMap{width:100%;height:100%}
  .leaflet-popup-content-wrapper{background:var(--ink-panel);color:var(--paper);border-radius:8px}
  .leaflet-popup-content{font-family:var(--sans);font-size:.8rem;line-height:1.5}
  .leaflet-popup-content b{color:var(--brass);font-family:var(--serif)}
  .leaflet-popup-tip{background:var(--ink-panel)}

  .mapstats{display:grid;gap:.7rem;align-content:start}
  .mapstats article{border:1px solid var(--line);background:var(--ink-panel);border-radius:10px;padding:1.2rem 1.3rem}
  .mapstats article.accent{border-color:var(--brass)}
  .mapstats strong{display:block;font-family:var(--serif);font-weight:450;font-size:1.9rem;margin:.4rem 0 .1rem}
  .mapstats article.accent strong{color:var(--brass)}
  .mapstats small{color:var(--slate);font-size:.72rem}

  #pageTransition{position:fixed;inset:0;background:var(--ink);z-index:9999;opacity:1;transition:opacity .55s ease;pointer-events:none}
  .skeleton-line{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--line) 25%,var(--line-strong) 37%,var(--line) 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite}
  @keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
  .bigmap .skeleton-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--ink);z-index:400;transition:opacity .4s ease}
  .bigmap .skeleton-overlay .dot{width:8px;height:8px;border-radius:50%;background:var(--brass);margin:0 4px;animation:bounce 1.1s ease-in-out infinite}
  .bigmap .skeleton-overlay .dot:nth-child(2){animation-delay:.15s}
  .bigmap .skeleton-overlay .dot:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-6px);opacity:1}}
</style>
</head>
<body>

<div class="page-transition" id="pageTransition"></div>
<nav class="top">
  <a href="index.html" class="mark">NIGRANI</a>
  <div class="links">
    <a href="report.html">Report</a>
    <a href="map.html" class="active">Map</a>
    <a href="feed.html">Feed</a>
  </div>
</nav>

<main>
  <div class="label">02 / Safety map</div>
  <h1>The city,<br><em>as a signal.</em></h1>

  <div class="panel-grid">
    <div class="bigmap">
      <span class="tag">DELHI NCR — live</span>
      <div id="dynamicMap"></div>
      <div class="skeleton-overlay" id="mapSkeleton"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    </div>
    <div class="mapstats">
      <article><span>CRITICAL</span><strong id="statCritical"><span class="skeleton-line" style="width:28px;display:inline-block"></span></strong><small>needs attention</small></article>
      <article><span>HIGH</span><strong id="statHigh"><span class="skeleton-line" style="width:28px;display:inline-block"></span></strong><small>priority cases</small></article>
      <article><span>MEDIUM</span><strong id="statMedium"><span class="skeleton-line" style="width:28px;display:inline-block"></span></strong><small>being monitored</small></article>
      <article class="accent"><span>ROUTING ENGINE</span><strong>ACTIVE</strong><small>Matched to relevant authority.</small></article>
    </div>
  </div>
</main>

<script>
gsap.timeline({ defaults:{ ease:'power3.out' } })
  .to('.label', { opacity:1, duration:.7 })
  .to('h1', { opacity:1, y:0, duration:1 }, '-=.3')
  .to('.panel-grid', { opacity:1, y:0, duration:1 }, '-=.5');

try{
  const lenis = new Lenis({ duration: 1.1, smoothWheel: true });
  function raf(t){ lenis.raf(t); requestAnimationFrame(raf); }
  requestAnimationFrame(raf);
}catch(e){}

const pageTransition = document.getElementById('pageTransition');
window.addEventListener('load', () => { requestAnimationFrame(() => { pageTransition.style.opacity = '0'; }); });
document.querySelectorAll('a[href$=".html"]').forEach(link => {
  link.addEventListener('click', e => {
    const dest = link.getAttribute('href');
    if (dest === location.pathname.split('/').pop()) return;
    e.preventDefault();
    pageTransition.style.pointerEvents = 'all';
    pageTransition.style.opacity = '1';
    setTimeout(() => { location.href = dest; }, 480);
  });
});
</script>

<script>
// ---------- Unmodified NIGRANI map logic (GET /api/reports/) ----------
// Backend endpoint, auth and rate limiting are entirely server-side and untouched here.
const API_BASE_URL =
  window.NIGRANI_API_BASE_URL ||
  localStorage.getItem('NIGRANI_API_BASE_URL') ||
  'https://nigrani-eg4p.onrender.com/api/reports';

const map = L.map('dynamicMap', { zoomControl:true }).setView([28.5921, 77.0460], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 19
}).addTo(map);

const severityColor = { critical:'#D97D6C', high:'#D8A65C', medium:'#C9BE7A' };
let markerLayer = L.layerGroup().addTo(map);

function normalizeSeverity(report) {
  const raw = String(report.urgency || 'Medium').toLowerCase();
  if (raw === 'critical') return 'critical';
  if (raw === 'high') return 'high';
  return 'medium';
}

function reportTitle(report) {
  if (Array.isArray(report.violations) && report.violations.length) {
    const first = report.violations[0];
    if (first?.category && first?.detail) return `${first.category}: ${first.detail}`;
    if (first?.detail) return first.detail;
    if (first?.category) return first.category;
  }
  if (report.complaint_draft) return report.complaint_draft;
  return 'Civic safety report';
}

function reportLocation(report) {
  const lat = Number(report.latitude);
  const lon = Number(report.longitude);
  if (Number.isFinite(lat) && Number.isFinite(lon)) return `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
  return 'Location not provided';
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, ch => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' }[ch]));
}

function pinIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div style="width:22px;height:22px;border-radius:50%;background:${color};border:2px solid rgba(245,243,238,.5);display:grid;place-items:center;color:#0D0F14;font-weight:700;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.5)">!</div>`,
    iconSize: [22,22],
    iconAnchor: [11,11]
  });
}

async function loadLiveReports() {
  try {
    const response = await fetch(`${API_BASE_URL}/`, {
      method: 'GET',
      headers: { 'Accept': 'application/json' },
      cache: 'no-store'
    });
    const data = await parseJSON(response);
    if (!response.ok) throw new Error(data.error || `Reports failed (${response.status})`);

    const reports = Array.isArray(data) ? data : (Array.isArray(data.results) ? data.results : []);
    renderMap(reports);
  } catch (error) {
    console.warn('Live reports unavailable:', error.message);
    const skeleton = document.querySelector('#mapSkeleton');
    if (skeleton) { skeleton.style.opacity = '0'; setTimeout(() => skeleton.remove(), 400); }
  }
}

function renderMap(reports) {
  const counts = { critical:0, high:0, medium:0 };
  markerLayer.clearLayers();

  reports.forEach(report => {
    const severity = normalizeSeverity(report);
    counts[severity]++;

    const lat = Number(report.latitude), lon = Number(report.longitude);
    if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;

    L.marker([lat, lon], { icon: pinIcon(severityColor[severity]) })
      .bindPopup(`<b>${severity.toUpperCase()}</b><br>${escapeHTML(reportTitle(report))}<br><small>${escapeHTML(reportLocation(report))}</small>`)
      .addTo(markerLayer);
  });

  document.querySelector('#statCritical').textContent = String(counts.critical).padStart(2,'0');
  document.querySelector('#statHigh').textContent = String(counts.high).padStart(2,'0');
  document.querySelector('#statMedium').textContent = String(counts.medium).padStart(2,'0');

  const skeleton = document.querySelector('#mapSkeleton');
  if (skeleton) { skeleton.style.opacity = '0'; setTimeout(() => skeleton.remove(), 400); }
}

async function parseJSON(response) {
  const text = await response.text();
  try { return text ? JSON.parse(text) : {}; } catch { return { error: `Server returned HTTP ${response.status}` }; }
}

loadLiveReports();
</script>
</body>
</html>
